*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;background:#f0f7ff;color:#e2e8f0;overflow:hidden;height:100vh;height:100dvh}
/* ===== 顶栏 ===== */
.topbar{position:absolute;top:12px;left:12px;right:12px;z-index:1200;display:flex;align-items:center;gap:10px;background:rgba(15,23,42,.92);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 14px;box-shadow:0 8px 30px rgba(2,8,23,.35)}
.topbar h1{font-size:16px;font-weight:700;color:#f1f5f9;letter-spacing:.3px}
.topbar .sub{font-size:11px;color:#7c8db5;margin-left:2px}
.topbar .btns{margin-left:auto;display:flex;gap:8px}
.tbtn{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.35);color:#93c5fd;border-radius:10px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.tbtn:hover{background:rgba(59,130,246,.28)}
/* ===== 地图 ===== */
.map-wrap{position:absolute;inset:0;background:#dbeafe}
#map{width:100%;height:100%}
.map-legend{position:absolute;left:16px;bottom:20px;z-index:900;background:rgba(15,23,42,.9);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;font-size:11px;color:#94a3b8}
.legend-line{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
/* ===== 左侧日程栏(PC) ===== */
.sidebar{position:absolute;top:70px;left:12px;bottom:16px;width:330px;z-index:1000;overflow-y:auto;scrollbar-width:none}
.sidebar::-webkit-scrollbar{display:none}
.day-card{margin:0 4px 10px;padding:14px 16px;border-radius:14px;background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.06);cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(10px)}
.day-card:hover{transform:translateX(3px);border-color:rgba(59,130,246,.4)}
.day-card.active{background:rgba(15,23,42,.98);border-color:#f97316;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.day-card.heavy-day{border-color:rgba(244,63,94,.35)}
.day-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.day-num{font-size:11px;font-weight:700;color:#f97316;letter-spacing:1.5px}
.day-date{font-size:11px;color:#a5b8d6}
.day-title{font-size:15px;font-weight:600;color:#f1f5f9;margin-bottom:6px;line-height:1.4}
.day-meta{display:flex;gap:14px;font-size:12px;color:#b8c6de;flex-wrap:wrap}
.day-meta i{color:#3b82f6;margin-right:4px}
.day-highlight{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.hl-tag{font-size:10.5px;color:#d7f3ff;background:rgba(14,165,233,.3);border:1px solid rgba(56,189,248,.5);padding:2px 8px;border-radius:999px}
.day-warning{margin-top:8px;font-size:11px;color:#ffd76a;background:rgba(251,191,36,.14);padding:7px 10px;border-radius:10px;border:1px solid rgba(251,191,36,.15);line-height:1.55}
/* ===== 详情面板 ===== */
.detail-panel{position:absolute;top:76px;right:16px;bottom:16px;width:400px;background:rgba(15,23,42,.95);backdrop-filter:blur(20px);border-radius:20px;border:1px solid rgba(255,255,255,.1);box-shadow:0 25px 80px rgba(0,0,0,.5);z-index:1001;display:none;flex-direction:column;overflow:hidden;animation:slideIn .35s cubic-bezier(.4,0,.2,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.detail-close{position:absolute;top:10px;right:10px;z-index:5;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:#cbd5e1;font-size:14px;cursor:pointer}
.detail-body{flex:1;overflow-y:auto;padding:0 16px 20px;scrollbar-width:thin}
.detail-hero{position:relative;margin:0 -16px 14px;padding:26px 20px 18px;border-radius:0}
.detail-hero h2{font-size:19px;font-weight:700;color:#fff;line-height:1.35;margin:8px 0 4px}
.detail-hero .dh-date{font-size:12px;color:#94a3b8}
.detail-hero .dh-num{font-size:44px;font-weight:800;opacity:.95}
.detail-hero .dh-tag{display:inline-block;margin-top:8px;font-size:11px;font-weight:600;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:3px 10px;border-radius:999px}
.dh-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.dh-stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px 10px;font-size:11.5px;color:#cbd5e1;line-height:1.5}
.dh-stat b{color:#fff;display:block;font-size:12px}
.detail-section{margin-top:14px}
.detail-section h3{font-size:13px;font-weight:700;color:#93c5fd;margin-bottom:8px;letter-spacing:.5px}
.tl{list-style:none}
.tl li{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.07);font-size:12px;color:#cbd5e1;line-height:1.55}
.tl li:last-child{border:none}
.tl-t{flex:0 0 46px;color:#f97316;font-weight:700;font-variant-numeric:tabular-nums}
.wp{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:12px;color:#e2e8f0;flex-wrap:wrap}
.wp:last-child{border:none}
.wp .n{flex:0 0 20px;height:20px;border-radius:50%;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.wp .name{font-weight:600}
.amap{margin-left:auto;background:#3b82f6;color:#fff;border-radius:8px;padding:4px 10px;font-size:11px;text-decoration:none;white-space:nowrap}
.amap:hover{background:#2563eb}
.spot-item{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.spot-item b{display:block;font-size:13px;color:#f1f5f9;margin-bottom:3px}
.spot-item .st{color:#22d3ee;font-size:11px;font-weight:600}
.spot-item p{margin:4px 0 0;font-size:12px;color:#94a3b8;line-height:1.6}
.bonus-item{border:1px dashed rgba(167,139,250,.4);background:rgba(139,92,246,.06)}
.bonus-item b{color:#ddd6fe}
.bonus-item .badge{display:inline-block;font-size:10.5px;color:#c4b5fd;background:rgba(139,92,246,.15);padding:2px 8px;border-radius:999px;margin:3px 0 6px}
.warnlist{list-style:none}
.warnlist li{position:relative;padding:6px 0 6px 20px;border-bottom:1px dashed rgba(255,255,255,.06);font-size:12px;color:#fcd34d;line-height:1.6}
.warnlist li:last-child{border:none}
.warnlist li::before{content:'\f071';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;left:0;top:7px;color:#f59e0b;font-size:11px}
.tipbox{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:12px;padding:10px 12px;font-size:12px;color:#bfdbfe;line-height:1.7}

.prep-panel{position:absolute;top:76px;right:16px;width:400px;max-height:calc(100vh-32px);background:rgba(15,23,42,.95);backdrop-filter:blur(20px);border-radius:20px;border:1px solid rgba(255,255,255,.1);box-shadow:0 25px 80px rgba(0,0,0,.5);z-index:1002;display:none;overflow-y:auto;padding:20px}
.prep-panel h2{font-size:16px;color:#f1f5f9;margin-bottom:4px}
.prep-panel .psub{font-size:11.5px;color:#7c8db5;margin-bottom:14px}
.prep-cat{margin-bottom:14px}
.prep-cat h3{font-size:13px;color:#93c5fd;margin-bottom:7px}
.prep-cat ul{list-style:none}
.prep-cat li{font-size:12.5px;color:#cbd5e1;padding:3.5px 0 3.5px 18px;position:relative;line-height:1.5}
.prep-cat li::before{content:'\f00c';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;left:0;color:#22c55e;font-size:11px}
.ckl{list-style:none;margin-top:8px}
.ckl li{font-size:12.5px;color:#e2e8f0;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.07);line-height:1.55}

.m-sheet{display:none}
.sheet-handle{display:none}
@media(max-width:768px){

  .sheet-handle{display:block;width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin:8px auto 4px;flex-shrink:0}
  .m-list{flex:1;overflow-y:auto;padding:6px 10px 14px}
  .m-card{background:#fff;border:1px solid #e8f0fe;border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;cursor:pointer;box-shadow:0 1px 8px rgba(0,120,200,.05);min-height:64px}
  .m-card.active{border:1.5px solid #f97316}
  .m-dot{flex:0 0 34px;height:34px;border-radius:10px;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
  .m-info{flex:1;min-width:0}
  .m-title{font-size:13px;font-weight:700;color:#1e293b;line-height:1.35}
  .m-meta{font-size:10.5px;color:#64748b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .m-tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
  .m-tag{font-size:9.5px;color:#0369a1;background:#e0f2fe;padding:1px 6px;border-radius:999px}
  .m-warn{font-size:10px;color:#b45309;background:#fef3c7;border-radius:6px;padding:3px 7px;margin-top:4px;line-height:1.45}
  .detail-panel{top:auto;right:0;left:0;bottom:0;width:100%;height:76vh;border-radius:20px 20px 0 0;animation:sheetUp .35s cubic-bezier(.4,0,.2,1)}
  .detail-panel .sheet-handle{display:block;margin:8px auto 0;flex-shrink:0}
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
  .prep-panel{right:10px;left:10px;top:auto;bottom:10px;width:auto;max-height:80vh;border-radius:20px}
}
@media(max-width:390px){.topbar h1{font-size:14px}}

/* ================= 坐标转换 ================= */
const PI=Math.PI,A=6378245.0,EE=0.00669342162296594323;
const outOfChina=(la,lo)=> lo<72.004||lo>137.8347||la<0.8293||la>55.8271;
const tLat=(x,y)=>{let r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;r+=(20*Math.sin(y*PI)+40*Math.sin(y/3*PI))*2/3;r+=(160*Math.sin(y/12*PI)+320*Math.sin(y*PI/30))*2/3;return r;};
const tLon=(x,y)=>{let r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;r+=(20*Math.sin(x*PI)+40*Math.sin(x/3*PI))*2/3;r+=(150*Math.sin(x/12*PI)+300*Math.sin(x/30*PI))*2/3;return r;};
function wgs2gcj(la,lo){if(outOfChina(la,lo))return[la,lo];let dLat=tLat(lo-105,la-35),dLon=tLon(lo-105,la-35);const radLat=la/180*PI,magic=Math.sin(radLat);const m2=1-EE*magic*magic,sm=Math.sqrt(m2);dLat=(dLat*180)/((A*(1-EE))/(m2*sm)*PI);dLon=(dLon*180)/(A/sm*Math.cos(radLat)*PI);return[la+dLat,lo+dLon];}
const P=(la,lo)=>wgs2gcj(la,lo);
function amapNav(la,lo,name){const c=wgs2gcj(la,lo);return 'https://uri.amap.com/navigation?to='+c[1].toFixed(6)+','+c[0].toFixed(6)+'&toName='+encodeURIComponent(name)+'&mode=car&policy=1';}
/* ================= v2 应用 ================= */
const HEAVY={4:1,5:1,8:1};
let curDay=0,map,layerGroup,dimFlag=false;
const gdRoad=()=>L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18,attribution:'©高德地图'});
const gdSat=()=>L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18,attribution:'©高德地图'});
function startApp(){if(!window.L){setTimeout(startApp,300);return;}initMap();buildSidebar();buildMobileList();buildPrep();}
function dayLineOf(o){return (o.road&&o.road.length?o.road:o.pts);}
function initMap(){
  map=L.map('map',{zoomControl:true,attributionControl:false}).setView(P(30.4,101.2),7);
  const road=gdRoad(),sat=gdSat();road.addTo(map);
  L.control.layers({'高德路网':road,'高德卫星':sat},null,{position:'bottomright'}).addTo(map);
  layerGroup=L.layerGroup();
  Object.entries(DAYS).forEach(([d,o])=>{
    L.polyline(dayLineOf(o).map(p=>P(p[0],p[1])),{color:COLORS[d],weight:4,opacity:.8}).addTo(layerGroup);
  });
  layerGroup.addTo(map);
  window.bonusGroup=L.layerGroup().addTo(map);
  STOPS.forEach(s=>{
    L.marker(P(s.p[0],s.p[1]),{icon:L.divIcon({className:'',html:'<div style="width:24px;height:24px;border-radius:50%;background:'+COLORS[s.d]+';color:#fff;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4)">'+s.d+'</div>',iconSize:[24,24],iconAnchor:[12,12]})}).bindPopup('<b>D'+s.d+'·宿 '+s.n+'</b>').addTo(map);
  });
  POIS.forEach(o=>{
    L.marker(P(o.p[0],o.p[1]),{icon:L.divIcon({className:'',html:'<div style="width:20px;height:20px;border-radius:50%;background:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;border:1.5px solid #c9c9c9;box-shadow:0 1px 3px rgba(0,0,0,.3)">'+o.e+'</div>',iconSize:[20,20],iconAnchor:[10,10]})}).bindPopup('<b>'+o.t+'</b><br>'+o.i).addTo(map);
  });
  const all=Object.values(DAYS).flatMap(o=>dayLineOf(o)).concat(STOPS.map(s=>s.p),POIS.map(o=>o.p)).map(p=>P(p[0],p[1]));
  map.fitBounds(L.latLngBounds(all).pad(0.04));
}
function buildSidebar(){

    const c=document.createElement('div');
    c.className='day-card'+(HEAVY[d]?' heavy-day':'');
    c.onclick=()=>showDay(+d);
    const tags=(o.spots||[]).slice(0,3).map(s=>'<span class="hl-tag">'+s.t.split('（')[0].split('·')[0]+'</span>').join('');
    const warn=(WARN[d]||[])[0]||'';
    c.innerHTML='<div class="day-top"><span class="day-num">D'+d+'</span><span class="day-date">'+o.date+'</span></div><div class="day-title">'+o.title+'</div><div class="day-meta"><span><i class="fa-solid fa-route"></i>'+o.stats[0][1]+'</span><span><i class="fa-solid fa-clock"></i>'+o.stats[1][1]+'</span></div><div class="day-highlight">'+tags+'</div>'+(warn?'<div class="day-warning"><i class="fa-solid fa-triangle-exclamation"></i> '+warn+'</div>':'');
    sb.appendChild(c);

}
function buildMobileList(){

function showDay(d){
  curDay=d;
  document.querySelectorAll('.day-card,.m-card').forEach(el=>el.classList.remove('active'));
  const o=DAYS[d];
  layerGroup.eachLayer(l=>{const st=l.options;if(st.color){l.setStyle({opacity:st.color===COLORS[d]?1:.15,weight:st.color===COLORS[d]?6:3});}});
  const pts=dayLineOf(o).map(p=>P(p[0],p[1]));
  map.fitBounds(L.latLngBounds(pts).pad(0.15));
  window.bonusGroup.clearLayers();
  const base=dayLineOf(o);
  (BONUS[d]||[]).forEach((b,i)=>{
    if(b.la===undefined)return;
    let bi=0,bd=1e9;
    base.forEach((p,j)=>{const dx=p[0]-b.la,dy=p[1]-b.lo;const dd=dx*dx+dy*dy;if(dd<bd){bd=dd;bi=j;}});
    L.polyline([P(base[bi][0],base[bi][1]),P(b.la,b.lo)],{color:'#a78bfa',weight:2,opacity:.8,dashArray:'6,6'}).addTo(window.bonusGroup);
    L.marker(P(b.la,b.lo),{icon:L.divIcon({className:'',html:'<div style="width:20px;height:20px;border-radius:50%;background:#7b4db3;color:#fff;font-weight:700;font-size:10px;display:flex;align-items:center;justify-content:center;border:2px dashed #c4b5fd;box-shadow:0 1px 4px rgba(0,0,0,.4)">'+String.fromCharCode(65+i)+'</div>',iconSize:[20,20],iconAnchor:[10,10]})}).bindPopup('<b>🔁 '+b.n+'</b><br>'+b.badge).addTo(window.bonusGroup);
  });
  const panel=document.getElementById('detailPanel');
  panel.style.display='flex';
  panel.querySelector('.detail-close').style.display=(window.innerWidth<=768)?'none':'block';
  const b=document.getElementById('detailBody');
  const heroBg='linear-gradient(140deg,'+COLORS[d]+'55 0%, #0f172a 65%)';
  let html='<div class="detail-hero" style="background:'+heroBg+'"><div class="dh-num" style="color:'+COLORS[d]+'">D'+d+'</div><h2>'+o.title+'</h2><div class="dh-date">'+o.date+' · '+o.tag+'</div><span class="dh-tag">'+o.stats[0][0]+' '+o.stats[0][1]+'</span>';
  html+='<div class="dh-stats">'+o.stats.slice(1).map(s=>'<div class="dh-stat">'+s[0]+'<b>'+s[1]+'</b></div>').join('')+'</div></div>';
  html+='<div class="detail-section"><h3><i class="fa-solid fa-clock" style="color:#f97316"></i> 当日时间线</h3><ul class="tl">'+o.timeline.map(t=>'<li><span class="tl-t">'+t[0]+'</span><span>'+t[1]+'</span></li>').join('')+'</ul></div>';
  html+='<div class="detail-section"><h3><i class="fa-solid fa-location-arrow" style="color:#f97316"></i> 导航途经点</h3>';
  o.wps.forEach((w,i)=>{
    html+='<div class="wp"><span class="n" style="background:'+COLORS[d]+'">'+(i+1)+'</span><span class="name">'+w.n+'</span><a class="amap" target="_blank" href="'+amapNav(w.la,w.lo,w.n)+'"><i class="fa-solid fa-map-location-dot"></i> 高德</a></div>';
  });
  html+='</div>';
  if(ATTRS[d]&&ATTRS[d].length){
    html+='<div class="detail-section"><h3><i class="fa-solid fa-camera" style="color:#f97316"></i> 景点与沿途可玩</h3>';
    ATTRS[d].forEach(a=>{html+='<div class="spot-item"><b>'+a.n+'</b><span class="st"> · '+a.badge+'</span><p>'+a.desc+'<br>💡 '+a.tip+'</p></div>';});
    html+='</div>';
  }
  if(o.spots&&o.spots.length){
    html+='<div class="detail-section"><h3><i class="fa-solid fa-star" style="color:#f97316"></i> 拍照机位（小红书验证）</h3>';
    o.spots.forEach(s=>{html+='<div class="spot-item"><b>'+s.t+'</b><span class="st"> · '+s.st+'</span><p>'+s.tip+'</p></div>';});
    html+='</div>';
  }
  if(BONUS[d]&&BONUS[d].length){
    html+='<div class="detail-section"><h3><i class="fa-solid fa-circle-plus" style="color:#a78bfa"></i> 加餐与替换景点</h3>';
    BONUS[d].forEach(a=>{html+='<div class="spot-item bonus-item"><b>'+a.n+'</b><span class="badge">'+a.badge+'</span><p>'+a.desc+'<br>💡 '+a.tip+'</p></div>';});
    html+='</div>';
  }
  if(WARN[d]&&WARN[d].length){
    html+='<div class="detail-section"><h3><i class="fa-solid fa-triangle-exclamation" style="color:#f59e0b"></i> 注意事项（小红书避坑）</h3><ul class="warnlist">'+WARN[d].map(w=>'<li>'+w+'</li>').join('')+'</ul></div>';
  }
  if(o.tips&&o.tips.length){
    html+='<div class="detail-section"><h3><i class="fa-solid fa-lightbulb" style="color:#f97316"></i> 当日贴士</h3><div class="tipbox">'+o.tips.map(t=>'• '+t).join('<br>')+'</div></div>';
  }
